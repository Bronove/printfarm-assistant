name: 功能建议
description: 提出适合打印农场或 Bambu Studio 工作流的改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 请描述实际工作流程，而不只是一个功能名称
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前怎样绕过
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议不依赖公开仓库中的闭源组件源码
          required: true
